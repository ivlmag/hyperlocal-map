<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hyperlocal</title>
    <meta name="description" content="Интерактивная карта зданий с адресами и городской справкой.">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="./styles.css?v=aea35c98b249">
  </head>
  <body>
    <main class="map-shell">
      <header class="topbar">
        <div class="brand"><strong>hyperlocal</strong></div>
        <form class="search" id="search-form">
          <input id="search-input" placeholder="Найти адрес" aria-label="Найти адрес" autocomplete="off">
          <button type="submit">Найти</button>
        </form>
      </header>
      <section class="map-stage">
        <div id="map" class="map" aria-label="Интерактивная карта зданий"></div>
        <aside id="info-card" class="info-card is-hidden" aria-hidden="true" aria-live="polite">
          <div class="info-heading">
            <img id="info-image" class="help-image hidden" src="./help-image.png" alt="">
            <h1 id="info-title">Выберите здание на карте</h1>
            <button id="info-close" class="info-close" type="button" aria-label="Закрыть справку">×</button>
          </div>
          <p id="info-text">Кликните по контуру дома. Если по адресу есть запись в локальной БД, она появится здесь.</p>
        </aside>
      </section>
      <footer class="footer"><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></footer>
    </main>
    <script src="./data.js?v=aea35c98b249"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./app.js?v=aea35c98b249" defer></script>
  </body>
</html>
