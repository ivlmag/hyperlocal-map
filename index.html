<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hyperlocal</title>
    <meta name="description" content="Интерактивная карта зданий с адресами и городской справкой.">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="./styles.css?v=21ec143e5188">
  </head>
  <body>
    <main class="map-shell">
      <header class="topbar">
        <div class="brand"><strong>hyperlocal</strong></div>
        <form class="search" id="search-form">
          <input id="search-input" placeholder="Найти адрес" aria-label="Найти адрес" autocomplete="off">
          <button type="submit">Найти</button>
        </form>
      </header>
      <section class="map-stage">
        <div id="map" class="map" aria-label="Интерактивная карта зданий"></div>
        <aside id="info-card" class="info-card is-hidden" aria-hidden="true" aria-live="polite">
          <div class="info-heading">
            <img id="info-image" class="help-image hidden" src="./help-image.png" alt="">
            <h1 id="info-title">Выберите здание на карте</h1>
            <button id="info-close" class="info-close" type="button" aria-label="Закрыть справку">×</button>
          </div>
          <div class="info-content">
            <div id="info-photo-wrap" class="info-photo-wrap hidden">
              <img id="info-photo" class="info-photo" alt="Фото здания">
            </div>
            <p id="info-text">Кликните по контуру дома. Если по адресу есть запись в локальной БД, она появится здесь.</p>
          </div>
          <button id="info-article" class="info-article hidden" type="button" aria-label="Открыть полную статью">
            <img class="article-icon" src="./assets/newspaper.png" alt="">
            <span>Полная статья</span>
          </button>
        </aside>
        <section id="article-view" class="article-view is-hidden" aria-hidden="true" aria-live="polite">
          <div class="article-page">
            <header class="article-heading">
              <h1 id="article-title"></h1>
              <button id="article-close" class="info-close" type="button" aria-label="Вернуться к карте">×</button>
            </header>
            <article id="article-content" class="article-content"></article>
          </div>
        </section>
      </section>
      <footer class="footer"><a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></footer>
    </main>
    <script src="./data.js?v=21ec143e5188"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./app.js?v=21ec143e5188" defer></script>
  </body>
</html>
